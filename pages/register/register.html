<!doctype html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Controle de gastos</title>
</head>

<body class="centralize">  
    <form>
        <div class="form-field">
            <div><label>Email</label></div>
            <input type="email" id="email" placeholder="seu@email.com" onblur="onBlurEmail()"/>
            <div class="error" id="email-required-error">
                Email é obrigatório
            </div>
            <div class="error" id="email-invalid-error">
                Email é inválido
            </div>
        </div>
        <div class="form-field">
            <div><label>Senha</label></div>
            <input type="password" id="password" placeholder="Senha" onblur="onBlurSenha()"/>
            <div class="error" id="password-required-error">
                Senha é obrigatória
            </div>
            <div class="error" id="password-min-length-error">
                Senha deve conter no nínimo 6 caracteres
            </div>
        </div>
        <div class="form-field">
            <div><label> Confirmar senha</label></div>
            <input type="password" id="confirmPassowrd" placeholder="Confirmar senha" onblur="onBlurConfirmarSenha()"/>
            <div class="error" id="password-doenst-match-error">
                Senha e Confirmar senha devem ser iguais
            </div>
        </div>
        <div>
            <button type="button" class="solid" disabled="true" id="register-button" onclick="register()">Registrar</button>
        </div>
        <div>
            <button type="button" class="clear" onClick="goToLoginPage()">Login</button>
        </div>
    </form>
</body>  

<link rel="stylesheet" href="../../global.css" />

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"> </script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"> </script>
<script src="../../firebase-init.js"> </script>
<script src="register.js"> </script>
<script src="../../usable.js"> </script>

</html>
