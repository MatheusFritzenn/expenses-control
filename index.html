<!doctype html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Login - Controle de gastos</title>
</head>

<body class="centralize">  
    <form>
        <div class="form-field">
            <label>Email</label><br/>
            <input type="email" name="email" id="email"placeholder="seu@email.com" onblur="onBlurEmail()"/>
            <div class="error" id="email-required-error">Email é obrigatório</div>
            <div class="error" id="email-invalid-error">Email é inválido</div>    
        </div>
        <div class="form-field">
            <label>Senha</label><br/>
            <input type="password" name="password" id="password" placeholder="senha" onblur="onBlurSenha()"/>
            <div class="error" id="password-required-error">Senha é obrigatória</div>
            <div class="error">Senha é inválida</div>
        </div>
        <div>
            <button type="button" class="clear" id="recover-password-button" disabled="true" onClick="recoverPassword()">Recuperar senha</button>
        </div>
        <div>        
            <button type="button" class="solid" id="login-button" disabled="true" onClick="login()">Entrar</button>
        </div>
        <div>
            <button type="button" class="outline" onClick="register()">Registrar</button>
        </div>
    </form>
</body>

<link rel="stylesheet" href="global.css" />

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"> </script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"> </script>
<script src="firebase-init.js"> </script>
<script src="index.js"> </script>
<script src="usable.js"> </script>


</html>
